name: Release

# Publishes a GitHub Release with the Windows and macOS builds when a version tag is pushed:
#   git tag v$(cat VERSION) && git push origin v$(cat VERSION)
# It runs the same build scripts used locally (windows/build.sh, mac/build.sh).
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # manual run: builds and uploads the artifacts, but doesn't publish a release

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (v${version}). Bump VERSION, commit, and re-tag." >&2
            exit 1
          fi

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (self-contained single-file exe)
        shell: bash
        run: ./build.sh windows nolaunch
      - name: Build installer (Inno Setup)
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress; fi
          "$iscc" "/DAppVersion=${version}" windows/installer.iss
      - name: Collect artifacts
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p out
          cp dist/windows/ParaphraseTool.exe "out/ParaphraseTool-v${version}-win-x64.exe"
          cp "dist/windows/ParaphraseToolSetup-${version}.exe" "out/ParaphraseTool-Setup-v${version}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Optional: sign with the same self-signed certificate as local builds so users keep their Accessibility
      # permission across updates. Add repo secrets MACOS_CERT_P12 (base64 of the .p12) and MACOS_CERT_PASSWORD
      # (see mac/make-signing-cert.sh --export). Without them the app is ad-hoc signed.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No signing certificate configured; the app will be ad-hoc signed."; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"; pw="$(uuidgen)"
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -passin "pass:$CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
      - name: Build (universal .app)
        run: ./build.sh mac nolaunch
      - name: Zip the app
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p out
          ditto -c -k --keepParent dist/mac/ParaphraseTool.app "out/ParaphraseTool-v${version}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Paraphrase Tool ${GITHUB_REF_NAME}" \
            --generate-notes
